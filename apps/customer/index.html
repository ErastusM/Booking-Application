<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Book trusted local salons, barbers, wellness studios, automotive services and more — booked in seconds." />
    <meta name="theme-color" content="#e6e8e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040505" media="(prefers-color-scheme: dark)" />
    <script>
      // Paint the document canvas (the <html> background) from the saved theme
      // BEFORE first paint, so dark mode never flashes a light strip behind the
      // status bar / home indicator. Kept in sync afterwards by ThemeContext.
      try {
        document.documentElement.style.backgroundColor =
          localStorage.getItem('darkMode') === 'true' ? '#0a0a0b' : '#e6e8e7';
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bookplus" />
    <link rel="preconnect" href="https://api.bookplus.pro" />
    <title>Bookplus — Book trusted local services</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
