<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Book trusted local salons, barbers, wellness studios, automotive services and more — booked in seconds." />
    <meta name="theme-color" content="#e6e8e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040505" media="(prefers-color-scheme: dark)" />
    <script>
      // Paint the document canvas (the <html> background) from the saved theme
      // BEFORE first paint, so dark mode never flashes a light strip behind the
      // status bar / home indicator. Kept in sync afterwards by ThemeContext.
      // Also sets data-theme so the boot splash below matches the theme.
      try {
        var __dark = localStorage.getItem('darkMode') === 'true';
        document.documentElement.style.backgroundColor = __dark ? '#0a0a0b' : '#e6e8e7';
        document.documentElement.setAttribute('data-theme', __dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <style>
      /* Boot splash — the CUSTOMER brand mark: lowercase "bookplus" with an orange
         smile, on white. Shown instantly (no JS) while the app loads, then faded
         out by main.jsx. */
      #app-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff; transition: opacity 0.45s ease;
        padding-top: env(safe-area-inset-top, 0px);
      }
      #app-splash.app-splash--hidden { opacity: 0; pointer-events: none; }
      #app-splash .as-inner {
        display: flex; flex-direction: column; align-items: center; gap: 0.85rem;
        animation: appSplashIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #app-splash .as-word {
        font-family: 'Plus Jakarta Sans Variable', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: clamp(2.7rem, 14vw, 3.4rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1;
        display: inline-flex; align-items: baseline;
      }
      #app-splash .as-word .b { color: #040505; }
      #app-splash .as-word .p { color: #f03e16; }
      #app-splash .as-pwrap { position: relative; display: inline-block; }
      /* Centered under "plus", uniform scale (NO preserveAspectRatio=none, which
         stretched the arc). width sets the size; height follows the viewBox aspect. */
      #app-splash .as-smile { position: absolute; left: 50%; transform: translateX(-50%); bottom: -0.54em; width: 92%; height: auto; overflow: visible; }
      #app-splash .as-tag {
        font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif;
        font-size: 0.72rem; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase;
        color: #7a7a7a; margin-top: 0.45rem; padding-left: 0.34em;
      }
      /* Hero tagline — moved here from the home page; the opening moment now
         carries the promise, so the home opens straight into search. */
      #app-splash .as-hero {
        font-family: 'Plus Jakarta Sans Variable', system-ui, -apple-system, Segoe UI, sans-serif;
        font-size: clamp(1.7rem, 8vw, 2.4rem); font-weight: 800; line-height: 1.08;
        letter-spacing: -0.02em; color: #040505; text-align: center; margin-top: 1.7rem;
      }
      #app-splash .as-hero .as-hero-accent { color: #f03e16; }
      #app-splash .as-hero-sub {
        font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif;
        font-size: 0.98rem; line-height: 1.5; color: #6a6a6a; text-align: center;
        margin-top: 0.7rem; max-width: 19rem;
      }
      @keyframes appSplashIn { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #app-splash .as-inner { animation: none; } }
    </style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bookplus" />
    <link rel="preconnect" href="https://api.bookplus.pro" />
    <title>Bookplus — Book trusted local services</title>

    <!-- Canonical + social defaults. These are the STATIC tags non-JS scrapers
         (Facebook/WhatsApp/Slack) see; per-page tags are set at runtime by the
         Seo component for Googlebot, which renders our JS. -->
    <link rel="canonical" href="https://www.bookplus.pro/" />
    <meta property="og:site_name" content="Bookplus" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bookplus — Book trusted local services" />
    <meta property="og:description" content="Discover and book trusted local businesses — hair, beauty, barbers, wellness, automotive and more. Real-time availability and instant confirmation." />
    <meta property="og:url" content="https://www.bookplus.pro/" />
    <meta property="og:image" content="https://www.bookplus.pro/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bookplus — Book trusted local services" />
    <meta name="twitter:description" content="Discover and book trusted local businesses. Real-time availability and instant confirmation." />
    <meta name="twitter:image" content="https://www.bookplus.pro/icon-512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Bookplus",
        "url": "https://www.bookplus.pro/",
        "logo": "https://www.bookplus.pro/icon-512.png"
      }
    </script>
</head>
<body>
    <div id="app-splash" aria-hidden="true">
        <div class="as-inner">
            <div class="as-word"><span class="b">book</span><span class="as-pwrap"><span class="p">plus</span><svg class="as-smile" viewBox="0 0 120 24" aria-hidden="true"><path d="M4 5 Q 60 13 116 5 Q 60 23 4 5 Z" fill="#f03e16" /></svg></span></div>
            <div class="as-tag">for customers</div>
            <div class="as-hero">All the best services.<br /><span class="as-hero-accent">Anywhere.</span></div>
            <div class="as-hero-sub">Book trusted professionals for any service, anytime.</div>
        </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
