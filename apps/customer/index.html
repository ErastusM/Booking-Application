<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Book trusted local salons, barbers, wellness studios, automotive services and more — booked in seconds." />
    <meta name="theme-color" content="#e6e8e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040505" media="(prefers-color-scheme: dark)" />
    <script>
      // Paint the document canvas (the <html> background) from the saved theme
      // BEFORE first paint, so dark mode never flashes a light strip behind the
      // status bar / home indicator. Kept in sync afterwards by ThemeContext.
      try {
        document.documentElement.style.backgroundColor =
          localStorage.getItem('darkMode') === 'true' ? '#0a0a0b' : '#e6e8e7';
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bookplus" />
    <link rel="preconnect" href="https://api.bookplus.pro" />
    <title>Bookplus — Book trusted local services</title>

    <!-- Canonical + social defaults. These are the STATIC tags non-JS scrapers
         (Facebook/WhatsApp/Slack) see; per-page tags are set at runtime by the
         Seo component for Googlebot, which renders our JS. -->
    <link rel="canonical" href="https://www.bookplus.pro/" />
    <meta property="og:site_name" content="Bookplus" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bookplus — Book trusted local services" />
    <meta property="og:description" content="Discover and book trusted local businesses — hair, beauty, barbers, wellness, automotive and more. Real-time availability and instant confirmation." />
    <meta property="og:url" content="https://www.bookplus.pro/" />
    <meta property="og:image" content="https://www.bookplus.pro/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bookplus — Book trusted local services" />
    <meta name="twitter:description" content="Discover and book trusted local businesses. Real-time availability and instant confirmation." />
    <meta name="twitter:image" content="https://www.bookplus.pro/icon-512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Bookplus",
        "url": "https://www.bookplus.pro/",
        "logo": "https://www.bookplus.pro/icon-512.png"
      }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
