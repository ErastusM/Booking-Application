<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Manage your bookings, calendar, team and earnings on Bookplus for Business." />
    <meta name="theme-color" content="#040505" />
    <script>
      // Paint the document canvas + status-bar tint from the saved theme BEFORE
      // first paint, so dark mode never flashes a light strip behind the status
      // bar / home indicator. Kept in sync afterwards by ThemeContext.
      try {
        var __dark = localStorage.getItem('darkMode') === 'true';
        document.documentElement.style.backgroundColor = __dark ? '#0a0a0b' : '#e6e8e7';
        document.documentElement.setAttribute('data-theme', __dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', __dark ? '#0a0a0b' : '#ffffff');
      } catch (e) {}
    </script>
    <style>
      /* Boot splash — the BUSINESS brand mark: "Bookplus" with an orange underline,
         on black. Shown instantly while the app loads, then faded out by main.jsx. */
      #app-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #040505; transition: opacity 0.45s ease;
        padding-top: env(safe-area-inset-top, 0px);
      }
      #app-splash.app-splash--hidden { opacity: 0; pointer-events: none; }
      #app-splash .as-inner {
        display: flex; flex-direction: column; align-items: center; gap: 0.85rem;
        animation: appSplashIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #app-splash .as-word {
        font-family: 'Plus Jakarta Sans Variable', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: clamp(2.7rem, 14vw, 3.4rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1;
        display: inline-flex; align-items: baseline;
      }
      #app-splash .as-word .b { color: #ffffff; }
      #app-splash .as-word .p { color: #f03e16; }
      #app-splash .as-pwrap { position: relative; display: inline-block; }
      /* Short centered dash under "plus", clearly below the text — matches the ref. */
      #app-splash .as-underline {
        position: absolute; left: 28%; right: 28%; bottom: -0.34em; height: 5px;
        border-radius: 3px; background: #f03e16;
      }
      #app-splash .as-tag {
        font-family: 'Plus Jakarta Sans Variable', system-ui, -apple-system, sans-serif;
        font-size: 0.72rem; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase;
        color: rgba(255,255,255,0.72); margin-top: 0.55rem; padding-left: 0.34em;
      }
      /* Hero tagline — the opening moment carries the promise (dark splash). */
      #app-splash .as-hero {
        font-family: 'Plus Jakarta Sans Variable', system-ui, -apple-system, Segoe UI, sans-serif;
        font-size: clamp(1.7rem, 8vw, 2.4rem); font-weight: 800; line-height: 1.08;
        letter-spacing: -0.02em; color: #ffffff; text-align: center; margin-top: 1.7rem;
      }
      #app-splash .as-hero .as-hero-accent { color: #f03e16; }
      #app-splash .as-hero-sub {
        font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif;
        font-size: 0.98rem; line-height: 1.5; color: rgba(255,255,255,0.72); text-align: center;
        margin-top: 0.7rem; max-width: 20rem;
      }
      @keyframes appSplashIn { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #app-splash .as-inner { animation: none; } }
    </style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bookplus Biz" />
    <link rel="preconnect" href="https://api.bookplus.pro" />
    <title>Bookplus for Business</title>
</head>
<body>
    <div id="app-splash" aria-hidden="true">
        <div class="as-inner">
            <div class="as-word"><span class="b">Book</span><span class="as-pwrap"><span class="p">plus</span><span class="as-underline"></span></span></div>
            <div class="as-tag">for business</div>
            <div class="as-hero">Run your business.<br /><span class="as-hero-accent">Anywhere.</span></div>
            <div class="as-hero-sub">Bookings, calendar, team and earnings — in one place.</div>
        </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
