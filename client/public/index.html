<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Bookplus — premium appointment booking for salons, barbers, spas, and service businesses.">
    <meta name="theme-color" content="#040505">

    <!-- Warm up the API connection early so the first request is faster -->
    <link rel="preconnect" href="https://api.bookplus.pro" crossorigin>

    <!-- Fonts — preconnect + load directly here (not a render-blocking CSS @import) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon-64.png">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bookplus">

    <title>Bookplus — Appointment Booking</title>
</head>

    <noscript>You need to enable JavaScript to run this app.</noscript>

</html>
