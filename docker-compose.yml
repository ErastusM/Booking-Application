version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: barbershop-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env.production

  server:
    image: erastusm/bookplus-server:latest
    container_name: barbershop-server
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    env_file:
      - .env.production

  client:
    image: erastusm/bookplus-client:latest
    container_name: barbershop-client
    restart: always
    depends_on:
      - server
    env_file:
      - .env.production

  nginx:
    image: nginx:alpine
    container_name: barbershop-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - client
      - server
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:

