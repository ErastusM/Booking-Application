services:
  mongodb:
    image: mongo:6.0
    container_name: bookplus-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env.production

  server:
    image: erastusm/bookplus-server:latest
    container_name: bookplus-server
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    env_file:
      - .env.production

  # Dual-app split (Epic 1): customer marketplace + business suite.
  customer:
    image: erastusm/bookplus-customer:latest
    container_name: bookplus-customer
    restart: always
    depends_on:
      - server

  business:
    image: erastusm/bookplus-business:latest
    container_name: bookplus-business
    restart: always
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: bookplus-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - server
      - customer
      - business
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:

