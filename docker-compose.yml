version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: barbershop-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  server:
    build: ./server
    container_name: barbershop-server
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/barbershop?authSource=admin
      JWT_SECRET: your_jwt_secret_key
      NODE_ENV: production
    volumes:
      - ./server:/app

  client:
    build: ./client
    container_name: barbershop-client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      REACT_APP_API_URL: http://server:5000

volumes:
  mongo_data:
