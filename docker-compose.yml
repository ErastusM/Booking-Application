# Every container's log is capped (3 files x 10 MB) so logs can never fill the
# disk. Docker's default json-file driver keeps logs forever.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    # MONGO_VERSION lives in /app/.env (the compose interpolation file the deploy
    # keeps), so a deploy never changes the database version by itself: only
    # the "MongoDB upgrade" workflow does, one major version at a time, with a
    # backup first and the data-format (featureCompatibilityVersion) step after.
    image: mongo:${MONGO_VERSION:-6.0}
    container_name: bookplus-mongo
    logging: *default-logging
    restart: always
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env.production
    # Readiness: the DB answers a ping. `ping` needs no auth, so this works
    # whether or not MONGO_INITDB credentials are set.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # PINNED PER-DEPLOY. The deploy job writes IMAGE_TAG=<commit sha> into /app/.env
  # (compose's interpolation file — NOT .env.production, which is only env_file:
  # for container environment) and CI tags every image with its commit. So the
  # three app services always move together, as one commit, and a deploy can
  # never land a customer build from one commit beside a server build from another.
  #
  # Keep the `:-latest` default. Verified on Compose v5.1.1: a bare ${IMAGE_TAG}
  # with /app/.env missing does NOT fail the file — compose only warns and
  # interpolates a blank string, yielding `erastusm/bookplus-server:`, a malformed
  # reference that survives `config` and blows up later at pull/up time. The
  # default turns that silent landmine into a valid reference.
  #
  # It is a safe fallback only because the deploy retags the droplet's LOCAL
  # `:latest` onto each successful rollout, so `latest` there means "what is
  # live" rather than "whatever was pulled last". Note `:-` also substitutes when
  # the variable is set but EMPTY, which is why the deploy refuses to run unless
  # IMAGE_TAG is a 40-character sha — otherwise a tag that failed to arrive would
  # quietly deploy `latest` under a green tick.
  server:
    image: erastusm/bookplus-server:${IMAGE_TAG:-latest}
    container_name: bookplus-server
    logging: *default-logging
    # Ceiling so one runaway container can't starve MongoDB (1 vCPU / 2 GB droplet).
    mem_limit: 640m
    restart: always
    # NOT published to the host. nginx reaches the API as http://server:5000 over
    # the compose network, so nothing needs the port on 0.0.0.0. Publishing it
    # exposed the API in cleartext beside nginx's TLS, and — because the app runs
    # `trust proxy: 1` — let a direct caller spoof X-Forwarded-For to mint a new
    # identity per request and walk straight through every per-IP rate limit,
    # including the auth ones.
    expose:
      - "5000"
    depends_on:
      - mongodb
    env_file:
      - .env.production
    # Readiness = the app is listening AND Mongo is connected. /api/health returns
    # 200 only when mongoose.readyState===1 (503 otherwise), and the server only
    # binds the port after connectDB() resolves — so an unhealthy status here means
    # "not ready to take traffic". node is used (no curl/wget dependency in the image).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # Nightly mongodump with rotation (+ optional S3-compatible offsite).
  # The safety net: mongo_data lives on this one host — without this, a disk
  # failure loses the business.
  backup:
    # Same version as the database, so mongodump always matches the server.
    image: mongo:${MONGO_VERSION:-6.0}
    container_name: bookplus-backup
    logging: *default-logging
    # Ceiling so one runaway container can't starve MongoDB (1 vCPU / 2 GB droplet).
    mem_limit: 384m
    restart: always
    depends_on:
      - mongodb
    volumes:
      - ./ops/backup:/ops:ro
      - ./backups:/backups
    env_file:
      - .env.production
    entrypoint: ["/bin/sh", "/ops/entrypoint.sh"]

  # Encrypted off-site copies of /backups + an alert when backups go stale.
  # Does nothing until OFFSITE_REMOTE and RCLONE_CONFIG_* are set in
  # .env.production (ops/backup/README.md). A backup that only lives on this
  # droplet is lost with the droplet.
  backup-offsite:
    image: rclone/rclone:1.68
    container_name: bookplus-backup-offsite
    restart: always
    logging: *default-logging
    mem_limit: 128m
    depends_on:
      - backup
    volumes:
      - ./ops/backup:/ops:ro
      - ./backups:/backups:ro
    env_file:
      - .env.production
    entrypoint: ["/bin/sh", "/ops/offsite.sh"]

  # Dual-app split (Epic 1): customer marketplace + business suite.
  customer:
    image: erastusm/bookplus-customer:${IMAGE_TAG:-latest}
    container_name: bookplus-customer
    logging: *default-logging
    # Ceiling so one runaway container can't starve MongoDB (1 vCPU / 2 GB droplet).
    mem_limit: 160m
    restart: always
    depends_on:
      - server
    # `serve -s dist` answers 200 on / once it's up. <500 = the static server is
    # serving; only a hard failure (connection refused / 5xx) marks it unhealthy.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  business:
    image: erastusm/bookplus-business:${IMAGE_TAG:-latest}
    container_name: bookplus-business
    logging: *default-logging
    # Ceiling so one runaway container can't starve MongoDB (1 vCPU / 2 GB droplet).
    mem_limit: 160m
    restart: always
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: bookplus-nginx
    logging: *default-logging
    # Ceiling so one runaway container can't starve MongoDB (1 vCPU / 2 GB droplet).
    mem_limit: 128m
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - server
      - customer
      - business
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    # Hits the plain-HTTP /healthz location (added in bookplus.conf) — proves nginx
    # is up and its config parsed, without needing TLS/SNI on the healthcheck.
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and nginx listens on
      # IPv4 only, so "localhost" marked a healthy nginx unhealthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  certbot:
    image: certbot/certbot
    logging: *default-logging
    # Ceiling so one runaway container can't starve MongoDB (1 vCPU / 2 GB droplet).
    mem_limit: 192m
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:
