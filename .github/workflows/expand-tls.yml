name: Expand TLS certificate (one-off)

# Manually triggered after the app./business. DNS records resolve: expands the
# Let's Encrypt certificate to cover the dual-app subdomains, then reloads
# nginx. Safe to re-run (certbot no-ops when the cert already has the SANs).
on:
  workflow_dispatch:

# Least privilege: the jobs only read the repo (Docker Hub and the server use
# their own secrets), so the workflow token can't be used to change the repo.
permissions:
  contents: read

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Expand certificate over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app
            # --allow-subset-of-names: a name whose DNS record is missing (as
            # app.bookplus.pro's was in October 2026) is dropped instead of
            # failing the whole certificate, so the live names keep renewing.
            # certbot saves the flag, so the 12-hourly `certbot renew` keeps it.
            docker compose run --rm --entrypoint certbot certbot certonly \
              --webroot -w /var/www/certbot --expand --non-interactive --agree-tos \
              --allow-subset-of-names \
              --cert-name bookplus.pro \
              -d bookplus.pro -d www.bookplus.pro -d api.bookplus.pro \
              -d app.bookplus.pro -d business.bookplus.pro
            docker compose exec nginx nginx -s reload
            docker compose run --rm --entrypoint certbot certbot certificates --cert-name bookplus.pro
