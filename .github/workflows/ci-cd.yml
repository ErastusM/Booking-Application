name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1) Always: run server tests + verify the client builds (PRs and pushes)
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-0123456789abcd
      REFRESH_TOKEN_SECRET: ci-refresh-secret-ci-refresh-secret-0123456789
      MONGODB_URI: mongodb://localhost:27017/bookplus-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Server — install & test
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Client — install & build
        working-directory: client
        env:
          CI: false            # don't fail the build on ESLint warnings
          GENERATE_SOURCEMAP: false
          REACT_APP_API_URL: https://api.bookplus.pro
        run: |
          npm ci
          npm run build

  # 2) On push to main only: build & push both images to Docker Hub
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: erastusm/bookplus-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          platforms: linux/amd64
          push: true
          tags: erastusm/bookplus-client:latest
          build-args: |
            REACT_APP_API_URL=https://api.bookplus.pro
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) On push to main: pull the new images on the server and restart.
  #    Skipped automatically unless the DEPLOY_HOST secret is configured.
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Deploy over SSH (compose pull + up)
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
