name: CI/CD

on:
  push:
    branches: [main]
  pull_request:   # no branch filter — stacked PRs (feature -> epic branch) need CI too

jobs:
  # 1) Always: run server tests + verify the client builds (PRs and pushes)
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-0123456789abcd
      REFRESH_TOKEN_SECRET: ci-refresh-secret-ci-refresh-secret-0123456789
      MONGODB_URI: mongodb://localhost:27017/bookplus-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version pinned by packageManager in root package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # apps/api is intentionally still npm-managed (own package-lock.json) so CI
      # tests exactly what the Docker image ships — see pnpm-workspace.yaml.
      - name: API — install & test
        working-directory: apps/api
        run: |
          npm ci
          npm test

      - name: Client — install & build
        env:
          CI: false            # don't fail the build on ESLint warnings
          GENERATE_SOURCEMAP: false
          REACT_APP_API_URL: https://api.bookplus.pro
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@bookplus/api-client" build
          pnpm --filter "@bookplus/ui" build
          pnpm --filter bookplus-client run build

      # Epic 1 apps (Vite) — build-only until they deploy in Epic 1.4
      - name: Customer + Business apps — build
        env:
          VITE_API_URL: https://api.bookplus.pro
        run: |
          pnpm --filter "@bookplus/customer" build
          pnpm --filter "@bookplus/business" build

  # 2) On push to main only: build & push both images to Docker Hub
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          platforms: linux/amd64
          push: true
          tags: erastusm/bookplus-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Root context: the client consumes workspace packages (packages/*),
      # which live outside ./client — the Dockerfile installs with pnpm.
      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          platforms: linux/amd64
          push: true
          tags: erastusm/bookplus-client:latest
          build-args: |
            REACT_APP_API_URL=https://api.bookplus.pro
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push customer app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/customer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: erastusm/bookplus-customer:latest
          build-args: |
            VITE_API_URL=https://api.bookplus.pro
            VITE_BUSINESS_URL=https://business.bookplus.pro
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push business app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/business/Dockerfile
          platforms: linux/amd64
          push: true
          tags: erastusm/bookplus-business:latest
          build-args: |
            VITE_API_URL=https://api.bookplus.pro
            VITE_CUSTOMER_URL=https://app.bookplus.pro
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) On push to main: pull the new images on the server and restart.
  #    Skipped automatically unless the DEPLOY_HOST secret is configured.
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      # Keep the droplet's compose + nginx config in lockstep with the repo —
      # new services/subdomains would otherwise require a manual copy.
      - name: Sync compose + nginx config to the host
        if: env.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,nginx/conf.d/bookplus.conf"
          target: /app
          overwrite: true

      - name: Deploy over SSH (compose pull + up)
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
