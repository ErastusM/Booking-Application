name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1a) Server tests (runs on every push / PR) ──────────────────────────────
  test-server:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-0123456789abcd
      REFRESH_TOKEN_SECRET: ci-refresh-secret-ci-refresh-secret-0123456789
      MONGODB_URI: mongodb://localhost:27017/bookplus-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install & test
        working-directory: server
        run: |
          npm ci
          npm test

  # ── 1b) Client build check (runs on every push / PR, in parallel) ───────────
  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install & build
        working-directory: client
        env:
          CI: false            # don't fail the build on ESLint warnings
          GENERATE_SOURCEMAP: false
          REACT_APP_API_URL: https://api.bookplus.pro
        run: |
          npm ci
          npm run build

  # ── 2a) Build & push server image (push to main only) ────────────────────────
  build-server:
    needs: test-server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: erastusm/bookplus-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # ── 2b) Build & push client image (push to main only, in parallel) ───────────
  build-client:
    needs: test-client
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: erastusm/bookplus-client
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./client
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            REACT_APP_API_URL=https://api.bookplus.pro
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  # ── 3) Deploy — pull new images and restart (push to main only) ──────────────
  #    Skipped automatically unless the DEPLOY_HOST secret is configured.
  deploy:
    needs: [build-server, build-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Deploy over SSH (compose pull + up)
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
      - name: Health check
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /app
            for i in 1 2 3 4 5 6 7 8; do
              stopped=$(docker compose ps -a | tail -n +2 | grep -cv "Up\|running" || true)
              if [ "$stopped" -eq 0 ]; then
                echo "✅ All containers running"
                docker compose ps
                exit 0
              fi
              echo "⏳ Attempt $i/8 — $stopped container(s) not up yet, waiting 5s..."
              sleep 5
            done
            echo "❌ Health check timed out after 40s"
            docker compose ps
            docker compose logs --tail=30
            exit 1
