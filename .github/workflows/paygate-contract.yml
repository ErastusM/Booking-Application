# Temporary: check our PayHost client against PayGate's public TEST merchant.
name: PayGate contract check (test account)
on:
  push:
    branches: [claude/last-deploy-time-cjjnu3]
    paths: [.github/paygate-contract/**, .github/workflows/paygate-contract.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: apps/api
      - name: Install a browser (Playwright)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null
          npm i --no-save playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/paygate-contract/pay.js
        env:
          PW_DIR: ${{ runner.temp }}/pw
