packages:
  - 'client'
  - 'apps/customer'
  - 'apps/business'
  - 'packages/*'
# apps/api intentionally stays npm-managed (own package-lock.json) so CI and the
# Docker image install exactly what ships today. It joins the workspace when its
# deploy pipeline is reworked.

# pnpm 10 blocks dependency build scripts by default; esbuild (vite's engine)
# needs its postinstall to place the platform binary.
onlyBuiltDependencies:
  - esbuild
