# Social crawlers get a server-rendered per-provider OG card (via the API's
# /api/seo/prerender endpoint) so shared booking links unfurl with the business's
# name, blurb and photo; every other client gets the SPA. This maps the user-agent
# to a flag used by the /b/ and /providers/ locations below. (map is http-context,
# and conf.d/*.conf is included inside http — so this belongs at the top here.)
map $http_user_agent $bp_is_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot|TelegramBot|Discordbot|Pinterest|redditbot|Applebot|SkypeUriPreview|vkShare|Embedly|Googlebot|bingbot|Google-InspectionTool|GoogleOther)" 1;
}

# HTTP — serve ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    server_name bookplus.pro www.bookplus.pro api.bookplus.pro app.bookplus.pro business.bookplus.pro;

    # Plain-HTTP liveness for the container healthcheck (no TLS/SNI needed).
    # Exact-match so it wins over the catch-all HTTPS redirect below.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# bookplus.pro (apex) — redirect to www
server {
    listen 443 ssl;
    server_name bookplus.pro;

    ssl_certificate     /etc/letsencrypt/live/bookplus.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookplus.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.bookplus.pro$request_uri;
}

# www.bookplus.pro — the customer app (legacy client retired)
server {
    listen 443 ssl;
    server_name www.bookplus.pro;

    ssl_certificate     /etc/letsencrypt/live/bookplus.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookplus.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # SEO: robots.txt + a dynamic sitemap of every provider's booking page are
    # generated by the API, but must live at the site ROOT for crawlers to find
    # them (www.bookplus.pro/sitemap.xml, /robots.txt). Proxy those two paths to
    # the API; everything else is the customer SPA.
    location = /sitemap.xml {
        proxy_pass         http://server:5000/api/seo/sitemap.xml;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass         http://server:5000/api/seo/robots.txt;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Per-provider social share cards. A crawler ($bp_is_bot) gets rewritten to the
    # internal prerender location (rewrite is safe inside `if`); humans fall through
    # to the same SPA proxy as everywhere else, so their experience is unchanged.
    location ^~ /b/ {
        if ($bp_is_bot) { rewrite ^ /__prerender$uri last; }
        proxy_pass         http://customer:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
    location ^~ /providers/ {
        if ($bp_is_bot) { rewrite ^ /__prerender$uri last; }
        proxy_pass         http://customer:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
    # Internal only — reached via the rewrite above, never directly. Maps
    # /__prerender/b/<slug> → API /api/seo/prerender/b/<slug>.
    location ^~ /__prerender/ {
        internal;
        proxy_pass         http://server:5000/api/seo/prerender/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://customer:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}

# api.bookplus.pro — backend
server {
    listen 443 ssl;
    server_name api.bookplus.pro;

    ssl_certificate     /etc/letsencrypt/live/bookplus.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookplus.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
    }
}

# app.bookplus.pro — consolidated into www (one customer domain). 301 keeps
# any early bookmarks working; the DNS record itself can be deleted.
server {
    listen 443 ssl;
    server_name app.bookplus.pro;

    ssl_certificate     /etc/letsencrypt/live/bookplus.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookplus.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.bookplus.pro$request_uri;
}

# business.bookplus.pro — business app (dual-app split, Epic 1)
