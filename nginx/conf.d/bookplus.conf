# HTTP — serve ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    server_name bookplus.pro www.bookplus.pro api.bookplus.pro app.bookplus.pro business.bookplus.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# bookplus.pro (apex) — redirect to www
server {
    listen 443 ssl;
    server_name bookplus.pro;

    ssl_certificate     /etc/letsencrypt/live/bookplus.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookplus.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.bookplus.pro$request_uri;
}

# www.bookplus.pro — the customer app (legacy client retired)
server {
    listen 443 ssl;
    server_name www.bookplus.pro;

    ssl_certificate     /etc/letsencrypt/live/bookplus.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookplus.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://customer:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}

